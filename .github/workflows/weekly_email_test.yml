name: Weekly dashboard email TEST

# ТЕСТОВАЯ копия weekly_email.yml. Шлёт письмо только Виталию, заказчики его не
# получают. Запускается двумя способами:
#   1) вручную (Run workflow): берёт самый свежий PDF из data/weekly_reports;
#   2) пушем PDF в data/weekly_reports_test.
# Тема, текст и имя вложения строятся так же, как в боевом weekly_email.yml,
# с пометкой ТЕСТ.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/weekly_reports_test/*.pdf"

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Найти PDF и назвать его по-русски
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE=$(ls -1 data/weekly_reports/*.pdf | tail -n1)
          else
            FILE=$(git -c core.quotepath=false diff-tree --no-commit-id --name-only -r HEAD -- 'data/weekly_reports_test/*.pdf' | tail -n1)
          fi
          if [ -z "$FILE" ]; then
            echo "Нет PDF, письмо не отправляю."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASENAME=$(basename "$FILE" .pdf)
          MON=(января февраля марта апреля мая июня июля августа сентября октября ноября декабря)
          case "$BASENAME" in
            weekly_*)
              END="${BASENAME#weekly_}"
              START=$(date -d "$END -6 days" +%Y-%m-%d)
              sd=$(date -d "$START" +%-d); sm=$(date -d "$START" +%-m); sy=$(date -d "$START" +%Y)
              ed=$(date -d "$END" +%-d); em=$(date -d "$END" +%-m); ey=$(date -d "$END" +%Y)
              if [ "$sy" != "$ey" ]; then
                PERIOD="$sd ${MON[$sm-1]} $sy - $ed ${MON[$em-1]} $ey"
              elif [ "$sm" != "$em" ]; then
                PERIOD="$sd ${MON[$sm-1]} - $ed ${MON[$em-1]} $ey"
              else
                PERIOD="$sd-$ed ${MON[$em-1]} $ey"
              fi
              ;;
            *) PERIOD="$BASENAME" ;;
          esac
          TITLE="ТЕСТ: Недельный отчет по задержкам и отменам, $PERIOD"
          mkdir -p mail
          CLEAN="mail/Недельный отчет по задержкам и отменам $PERIOD.pdf"
          cp "$FILE" "$CLEAN"
          echo "send=true" >> "$GITHUB_OUTPUT"
          echo "file=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Отправить тестовое письмо
        if: ${{ steps.find.outputs.send == 'true' && env.SMTP_HOST != '' && env.SMTP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Отчёт по вылетам (тест) <${{ secrets.SMTP_USER }}>
          to: vitalydmitriyev@gmail.com,vdmitriev@gkvinegret.ru
          subject: ${{ steps.find.outputs.title }}
          body: Тестовая рассылка, коллегам это письмо не уходило. Недельный отчет по задержкам и отменам рейсов из аэропортов Москвы за ${{ steps.find.outputs.period }} во вложении.
          attachments: ${{ steps.find.outputs.file }}
