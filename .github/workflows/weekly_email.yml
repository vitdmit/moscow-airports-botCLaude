name: Weekly dashboard email

# ДОБАВЛЕНО 16.09.2026: рутина «Недельный дашборд по вылетам» (claude.ai/code)
# по вторникам в 10:00 МСК собирает PDF и коммитит его сюда, в
# data/weekly_reports/weekly_<дата>.pdf. Этот workflow срабатывает на такой
# коммит и рассылает письмо с этим же PDF во вложении — той же аналитикой,
# что ушла Виталию в чат, без пересборки.
#
# Секреты те же, что у daily.yml: SMTP_HOST, SMTP_PORT, SMTP_USER,
# SMTP_PASSWORD. Если SMTP_HOST/SMTP_PASSWORD не заданы, письмо просто не
# отправляется (файл в репозитории всё равно останется).

on:
  push:
    branches: [main]
    paths:
      - "data/weekly_reports/*.pdf"

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Найти новый PDF в этом коммите
        id: find
        run: |
          FILE=$(git diff-tree --no-commit-id --name-only -r HEAD -- 'data/weekly_reports/*.pdf' | tail -n1)
          if [ -z "$FILE" ]; then
            echo "В этом коммите нет нового PDF, письмо не отправляю."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          BASENAME=$(basename "$FILE" .pdf)
          echo "end_date=${BASENAME#weekly_}" >> "$GITHUB_OUTPUT"

      - name: Отправить письмо
        if: ${{ steps.find.outputs.send == 'true' && env.SMTP_HOST != '' && env.SMTP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Дашборд по вылетам <${{ secrets.SMTP_USER }}>
          to: vitalydmitriyev@gmail.com,vdmitriev@gkvinegret.ru,rahmetov@gkvinegret.ru,kkashirina@gkvinegret.ru,apan@gkvinegret.ru,ffilippov@gkvinegret.ru
          subject: Недельный дашборд по вылетам, неделя до ${{ steps.find.outputs.end_date }}
          body: Дашборд по вылетам из аэропортов Москвы за прошедшую неделю во вложении.
          attachments: ${{ steps.find.outputs.file }}
