name: Daily fetch (AeroDataBox)

# Раз в сутки. Берём ПОЗАВЧЕРАШНИЙ день: к утру данные FIDS по всем
# аэропортам уже полностью наполнены. Запуск в 06:00 UTC = 09:00 МСК.
#
# ИЗМЕНЕНИЕ 2026-07: после сбора идёт проверка полноты последних 14 дней
# против медианы дня недели + автодосбор до 2 дырявых дней за запуск.
# Если после этого неполные дни остались — workflow становится КРАСНЫМ
# (GitHub пришлёт письмо), но собранные данные всё равно закоммичены.
#
# ИЗМЕНЕНИЕ 2026-09: из тех же ответов API считается операционная сводка
# (план, отмены, задержки по зонам и терминалам) в data/ops_daily/ и
# уходит письмом. Дополнительных запросов к API это не требует.
# Письмо отправляется, только если в секретах задан SMTP_HOST.
# Нужные секреты: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, OPS_MAIL_TO.
# secure: true — это SSL (обычно порт 465). Для STARTTLS на 587 поставить false.
# ЗАПУСК. Расписание GitHub убрано 04.09.2026: оно не гарантированное, под
# нагрузкой прогон задерживается или пропускается совсем. 04.09 так и вышло,
# письмо в 9 утра не пришло. Единственный триггер теперь задача в cron-job.org
# ("Ежедневный сбор рейсов", 8:25 МСК), она бьёт минута в минуту. Два триггера
# держать нельзя: получится два сбора и два письма в сутки.
on:
  workflow_dispatch:
    inputs:
      fetch_date:
        description: "Дата сбора YYYY-MM-DD (пусто = позавчера)"
        required: false
        default: ""

concurrency:
  group: airports-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch flights
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          FETCH_DATE: ${{ github.event.inputs.fetch_date }}
        run: python -m src.daily_fetch

      - name: Completeness check + auto-heal
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          FETCH_DATE: ${{ github.event.inputs.fetch_date }}
        run: python -m src.completeness_check

      - name: Commit daily CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily data/ops_daily data/aerodatabox_usage.json data/completeness_exceptions.json
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi
          git commit -m "daily: обновление данных $(date -u +'%Y-%m-%dT%H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push retry $i…"
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after 3 retries" >&2
          exit 1

      - name: Собрать письмо по вылетам
        id: ops
        continue-on-error: true
        env:
          OPS_DATE: ${{ github.event.inputs.fetch_date }}
        run: python -m src.ops_email

      - name: Отправить письмо
        if: ${{ env.SMTP_HOST != '' && env.SMTP_PASSWORD != '' && steps.ops.outcome == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Отчёт по вылетам <${{ secrets.SMTP_USER }}>
          # Получатели списком прямо здесь, а не в секрете: так их видно в
          # файле и все они попадают в поле «Кому» одного письма. Через
          # запятую, без пробелов после запятой. Секрет OPS_MAIL_TO больше
          # не используется, но оставлен в репозитории на всякий случай.
          to: vdmitriev@gkvinegret.ru,rahmetov@gkvinegret.ru,kkashirina@gkvinegret.ru,apan@gkvinegret.ru,ffilippov@gkvinegret.ru
          subject: ${{ steps.ops.outputs.subject }}
          html_body: file:///tmp/ops_body.html
          convert_markdown: false

      - name: Alarm if incomplete days remain
        run: |
          if [ -f /tmp/completeness_flag.txt ]; then
            echo "НОВЫЕ НЕПОЛНЫЕ ДНИ (пересоберутся в следующих запусках):"
            cat /tmp/completeness_flag.txt
            exit 1
          fi
          echo "Полнота в норме (известные дыры источника: data/completeness_exceptions.json)."
