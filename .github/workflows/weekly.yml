name: Недельный дашборд по вылетам (без рассылки)

# Собирает PDF за отчётную неделю из data/ops_daily и кладёт артефактом
# в прогон. К API не обращается, расход запросов нулевой.
#
# ПИСЬМО ОТСЮДА НЕ УХОДИТ. Решение Виталия от 11.09.2026: заказчикам нужен
# дашборд с разбором, а разбор пишет Клод. Actions текст не пишет, там нет
# ИИ. Боевой маршрут теперь такой:
#   вторник 10:00 МСК -> задача Cowork поднимает сессию Клода
#   -> сессия клонирует этот репозиторий, считает факты (WEEK_FACTS)
#   -> Клод пишет разбор, собирает PDF (WEEK_ANALYSIS)
#   -> файл приходит Виталию, он рассылает заказчикам сам.
#
# Этот workflow остаётся запасным вариантом: собрать тот же дашборд
# шаблонным текстом, если вторничная задача упала.
#
# Вход week_end: воскресенье отчётной недели, YYYY-MM-DD. Пусто = последняя
# неделя, у которой есть все семь сводок.
on:
  workflow_dispatch:
    inputs:
      week_end:
        description: "Воскресенье отчётной недели YYYY-MM-DD (пусто = последняя закрытая)"
        required: false
        default: ""

concurrency:
  group: airports-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Системные библиотеки для weasyprint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0 \
            fonts-dejavu-core

      - name: Install deps
        run: pip install -r requirements.txt duckdb==1.5.5 weasyprint==69.0

      - name: Выгрузить факты
        env:
          WEEK_END: ${{ github.event.inputs.week_end }}
          WEEK_FACTS: /tmp/weekly_facts.json
        run: python -m src.weekly_report

      - name: Собрать дашборд
        id: wk
        env:
          WEEK_END: ${{ github.event.inputs.week_end }}
        run: python -m src.weekly_report

      - name: Положить артефактом
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ steps.wk.outputs.week_end }}
          path: |
            /tmp/weekly_*.pdf
            /tmp/weekly_facts.json
          retention-days: 30
