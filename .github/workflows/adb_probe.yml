name: Проба AeroDataBox по номерам рейсов (DME 11-25.10)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airports-write
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        run: python -m src.adb_probe
      - name: Commit result
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/adb_probe data/aerodatabox_usage.json
          git diff --cached --quiet && exit 0
          git commit -m "adb_probe: результат пробы по номерам"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
          exit 1
